name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare Project Structure
      run: |
        cordova create temp_app com.example.vaultkalkulator "Kalkulator Rahasia"
        rm -rf temp_app/www
        mv www temp_app/
        mv config.xml temp_app/
        mv package.json temp_app/
        cd temp_app
        cordova platform add android

    - name: Build APK
      run: |
        cd temp_app
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release-apk
        path: temp_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
